spring:
  application:
    name: queuepick
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/queuepick}
    username: ${DB_USERNAME:queuepick}
    password: ${DB_PASSWORD:local_only_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

