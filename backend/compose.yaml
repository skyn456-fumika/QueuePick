services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: queuepick
      POSTGRES_USER: queuepick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuepick -d queuepick"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:

